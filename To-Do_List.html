<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Studio - Premium To-Do List</title>
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link External CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Title & Subtitle -->
        <h2>TaskFlow Studio</h2>
        <div class="subtitle">Organize your daily tasks beautifully</div>

        <!-- Input Section -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Write a task and hit Enter...">
            <select id="prioritySelect" class="priority-select">
                <option value="low">Low</option>
                <option value="normal" selected>Normal</option>
                <option value="high">High</option>
            </select>
            <button onclick="addTask()" class="add-btn">
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add
            </button>
        </div>

        <!-- Top Action Bar -->
        <div class="action-bar">
            <button onclick="openConfirmDialog()" class="clear-btn">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Clear All
            </button>
        </div>

        <!-- Stats Container -->
        <div class="stats-container">
            <div class="stats-header">
                <div>Progress</div>
                <div class="stats-numbers">
                    Pending: <span id="pendingCount">0</span> | Completed: <span id="completedCount">0</span>
                </div>
            </div>
            <div class="progress-bar-track">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <button id="filter-all" class="filter-btn active" onclick="filterTasks('all')">All</button>
            <button id="filter-pending" class="filter-btn" onclick="filterTasks('pending')">Pending</button>
            <button id="filter-completed" class="filter-btn" onclick="filterTasks('completed')">Completed</button>
        </div>

        <!-- Dynamic Task List -->
        <div id="taskList"></div>

        <!-- Dark Mode Toggle & Footer -->
        <div class="bottom-bar">
            <div class="theme-toggle-container" onclick="toggleDarkMode()">
                <div class="toggle-switch">
                    <div class="toggle-circle">
                        <!-- Sun Icon -->
                        <svg class="sun-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <!-- Moon Icon -->
                        <svg class="moon-icon" viewBox="0 0 24 24">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </div>
                </div>
                <span class="toggle-label">Theme Mode</span>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Area -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Customized Dialog for Confirmation -->
    <div id="confirmDialogOverlay" class="dialog-overlay">
        <div class="dialog">
            <div class="dialog-title">Clear All Tasks?</div>
            <div class="dialog-body">Are you sure you want to permanently delete all tasks? This action cannot be undone.</div>
            <div class="dialog-buttons">
                <button class="dialog-btn-cancel" onclick="closeConfirmDialog()">Cancel</button>
                <button class="dialog-btn-confirm" onclick="confirmClearTasks()">Clear All</button>
            </div>
        </div>
    </div>

    <!-- Link External JS Script -->
    <script src="script.js"></script>
</body>
</html>
